name: Release APK

# v1.2.3-regular / v1.2.3-emergency 形式のタグを push すると、
# ビルド → 署名 → GitHub Release に APK を添付する。
on:
  push:
    tags:
      - 'v*-regular'
      - 'v*-emergency'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"      # 例: v1.2.3-regular
          V="${TAG#v}"                  # 1.2.3-regular
          echo "name=${V%-*}" >> "$GITHUB_OUTPUT"   # 1.2.3

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PVERSION_NAME=${{ steps.ver.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "North-${GITHUB_REF_NAME}.apk"
          sha256sum "North-${GITHUB_REF_NAME}.apk" | tee "North-${GITHUB_REF_NAME}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "North-${GITHUB_REF_NAME}.apk" "North-${GITHUB_REF_NAME}.apk.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes