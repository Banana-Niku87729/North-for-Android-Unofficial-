name: Release APK

# v1.2.3-regular / v1.2.3-emergency 形式のタグを push すると、
# ビルド → 署名 → GitHub Release に APK を添付する。
on:
  push:
    tags:
      - 'v*-regular'
      - 'v*-emergency'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing release signing secret::$name is empty. Configure it in the repository Actions secrets."
              exit 1
            fi
          done

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "::error title=Invalid release keystore::KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error title=Empty release keystore::The decoded keystore is empty."
            exit 1
          fi

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"      # 例: v1.2.3-regular
          V="${TAG#v}"                  # 1.2.3-regular
          N="${V%-*}"                   # 1.2.3
          echo "name=${N}" >> "$GITHUB_OUTPUT"
          # versionCode = メジャー*10000 + マイナー*100 + パッチ（1.1.6 -> 10106）。
          # F-Droid が読む app/build.gradle.kts の versionCode も同じ式で揃えること。
          IFS=. read -r MA MI PA <<< "$N"
          echo "code=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleFullRelease
          -PVERSION_NAME=${{ steps.ver.outputs.name }}
          -PVERSION_CODE=${{ steps.ver.outputs.code }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/full/release/*.apk | head -n 1)
          cp "$APK" "North-${GITHUB_REF_NAME}.apk"
          sha256sum "North-${GITHUB_REF_NAME}.apk" | tee "North-${GITHUB_REF_NAME}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "North-${GITHUB_REF_NAME}.apk" "North-${GITHUB_REF_NAME}.apk.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes